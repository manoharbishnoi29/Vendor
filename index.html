<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OldKart</title>
<style>
:root{--p:#3b3fd8;--ink:#151826;--bg:#f2f4f7;--mut:#6b7285;--line:#d9dde6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:64px}
.pad,.box{padding:14px;max-width:700px;margin:auto}.box{margin-top:40px}
h1{font-size:30px;margin:0 0 4px}
input,select,textarea,.btn{width:100%;padding:12px;margin:5px 0;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:90px;font-family:inherit}
.btn{background:var(--p);color:#fff;border:0;font-weight:600}
.btn.alt{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn:disabled{opacity:.5}
.lnk{background:none;border:0;color:var(--p);font-size:15px;padding:8px 0;cursor:pointer}
.mut{color:var(--mut);font-size:13px;margin:3px 0}
.top{position:sticky;top:0;background:#fff;padding:10px;z-index:5;box-shadow:0 1px 4px #0002}
.top input,.top select{margin:3px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chips span{white-space:nowrap;padding:6px 12px;border-radius:16px;background:#e6e9f0;font-size:14px}
.chips span.on{background:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 1px 3px #0002}
.card img{width:100%;height:130px;object-fit:cover;display:block;background:#e6e9f0}
.card .b{padding:8px}
.card .h{position:absolute;top:6px;right:6px;background:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:16px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px}
.car img{width:100%;flex:none;scroll-snap-align:center;max-height:300px;object-fit:cover;border-radius:10px}
.pv{display:flex;gap:6px;flex-wrap:wrap}.pv img{width:70px;height:70px;object-fit:cover;border-radius:6px}
#nav{position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;display:flex;border-top:1px solid var(--line);z-index:9}
#nav[hidden]{display:none}
#nav button{flex:1;border:0;background:none;font-size:12px;color:var(--mut)}
#nav button.on{color:var(--p);font-weight:700}
#toast{display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;z-index:20;max-width:90%;text-align:center}
.row2{background:#fff;padding:12px;border-radius:10px;margin:8px 0}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:10px;border:0;border-radius:8px;background:#e6e9f0;font-size:14px}
.tabs button.on{background:var(--p);color:#fff}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;background:#e6e9f0}
.chat{display:flex;flex-direction:column;height:calc(100vh - 56px)}
.ch-h{display:flex;gap:8px;align-items:center;padding:8px;background:#fff;border-bottom:1px solid var(--line)}
.ms{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:8px 12px;border-radius:14px;background:#fff;align-self:flex-start;word-break:break-word}
.m.me{background:var(--p);color:#fff;align-self:flex-end}
.ch-f{display:flex;gap:6px;padding:8px;background:#fff}.ch-f input{margin:0}.ch-f .btn{width:80px;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden>
  <button data-v="home">🏠<br>Home</button>
  <button data-v="sell">➕<br>Becho</button>
  <button data-v="chats">💬<br>Chats</button>
  <button data-v="profile">👤<br>Profile</button>
</nav>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const A = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const DEF_CATS = ["Mobiles", "Vehicles", "Electronics", "Furniture", "Fashion", "Books", "Others"];

let me = null, myDoc = null, cats = [], ads = [], favs = new Set(), pos = null, unsub = null;
let pendingName = "", imgs = [], chatMeta = {};
let F = { q: "", cat: "", sort: "new" };

const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2800); };

const km = (a, b) => {
  const R = 6371, r = x => x * Math.PI / 180, dl = r(b.lat - a.lat), dg = r(b.lng - a.lng);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dg / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const getLoc = () => new Promise(res => {
  if (pos) return res(pos);
  if (!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(
    p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude }; res(pos); },
    () => { toast("Location allow karo"); res(null); }
  );
});

const compress = file => new Promise(res => {
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const s = Math.min(1, 700 / Math.max(i.width, i.height));
      const c = document.createElement("canvas");
      c.width = i.width * s; c.height = i.height * s;
      c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.6));
    };
    i.src = r.result;
  };
  r.readAsDataURL(file);
});

/* ---------- navigation ---------- */
const views = { home: viewHome, sell: viewSell, chats: viewChats, profile: viewProfile, detail: viewDetail, chat: viewChat };
function go(v, arg) {
  if (unsub) { unsub(); unsub = null; }
  $("#nav").hidden = false;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  views[v](arg);
  window.scrollTo(0, 0);
}
$("#nav").onclick = e => { const v = e.target.closest("button")?.dataset.v; if (v) go(v); };
A.addEventListener("click", e => {
  const f = e.target.closest("[data-fav]");
  if (f) { e.stopPropagation(); toggleFav(f.dataset.fav, f); return; }
  const ch = e.target.closest("[data-chat]");
  if (ch) { go("chat", chatMeta[ch.dataset.chat]); return; }
  const c = e.target.closest("[data-ad]");
  if (c) go("detail", c.dataset.ad);
});

/* ---------- auth ---------- */
function viewAuth() {
  $("#nav").hidden = true;
  A.innerHTML = `<div class="box"><h1>🛍️ OldKart</h1><p class="mut">Purani cheezein khareedo aur becho</p>
  <input id="n" placeholder="Naam (sirf signup ke liye)">
  <input id="e" type="email" placeholder="Email">
  <input id="p" type="password" placeholder="Password (min 6 akshar)">
  <button class="btn" id="su">Signup</button>
  <button class="btn alt" id="li">Login</button>
  <button class="lnk" id="fp">Password bhool gaye?</button></div>`;
  $("#su").onclick = async () => {
    try { pendingName = $("#n").value.trim(); await createUserWithEmailAndPassword(auth, $("#e").value, $("#p").value); }
    catch (e) { toast(e.message); }
  };
  $("#li").onclick = async () => {
    try { await signInWithEmailAndPassword(auth, $("#e").value, $("#p").value); }
    catch (e) { toast("Email ya password galat hai"); }
  };
  $("#fp").onclick = async () => {
    const e = $("#e").value; if (!e) return toast("Pehle email likho");
    try { await sendPasswordResetEmail(auth, e); toast("Reset link email par bhej diya"); } catch (x) { toast(x.message); }
  };
}

onAuthStateChanged(auth, async u => {
  if (!u) { me = null; viewAuth(); return; }
  const r = doc(db, "users", u.uid);
  let s = await getDoc(r);
  if (!s.exists()) {
    await setDoc(r, { name: pendingName || u.email.split("@")[0], email: u.email, phone: "", city: "", role: "user", isBlocked: false, createdAt: serverTimestamp() });
    s = await getDoc(r);
  }
  myDoc = s.data();
  if (myDoc.isBlocked) { await signOut(auth); alert("Aapka account block hai. Admin se baat karo."); return; }
  me = u;
  try { const c = await getDocs(collection(db, "categories")); cats = c.docs.map(d => d.data().name); } catch (e) {}
  if (!cats.length) cats = DEF_CATS;
  const f = await getDocs(collection(db, "users", u.uid, "favs"));
  favs = new Set(f.docs.map(d => d.id));
  try { await setDoc(doc(db, "daily_activity", today() + "_" + u.uid), { uid: u.uid, date: today() }); } catch (e) {}
  go("home");
});

/* ---------- home ---------- */
const card = a => `<div class="card" data-ad="${a.id}"><img src="${a.images?.[0] || ""}" alt="">
  <button class="h" data-fav="${a.id}">${favs.has(a.id) ? "❤️" : "🤍"}</button>
  <div class="b"><b>₹${a.price}</b><div>${esc(a.title)}</div>
  <div class="mut">📍 ${esc(a.city)}${a.dist != null ? " • " + a.dist.toFixed(1) + " km" : ""}</div></div></div>`;

async function viewHome() {
  A.innerHTML = `<div class="top"><input id="q" placeholder="🔍 Search karo..." value="${esc(F.q)}">
  <select id="so"><option value="new">Naya pehle</option><option value="near">Paas wale pehle</option><option value="lo">Price: kam se zyada</option><option value="hi">Price: zyada se kam</option></select>
  <div class="chips" id="ch"></div></div><div id="list" class="grid"><p class="mut">Loading...</p></div>`;
  const ch = $("#ch");
  ch.innerHTML = ["", ...cats].map(c => `<span data-c="${esc(c)}" class="${F.cat === c ? "on" : ""}">${esc(c) || "Sab"}</span>`).join("");
  ch.onclick = e => {
    if (e.target.dataset.c === undefined) return;
    F.cat = e.target.dataset.c;
    [...ch.children].forEach(x => x.classList.toggle("on", x === e.target));
    renderList();
  };
  $("#q").oninput = e => { F.q = e.target.value; renderList(); };
  $("#so").value = F.sort;
  $("#so").onchange = async e => { F.sort = e.target.value; if (F.sort === "near") await getLoc(); renderList(); };
  const s = await getDocs(query(collection(db, "ads"), where("status", "==", "approved"), limit(200)));
  ads = s.docs.map(d => ({ id: d.id, ...d.data() }));
  renderList();
}
function renderList() {
  const box = $("#list"); if (!box) return;
  const q = F.q.toLowerCase();
  const L = ads.filter(a => (!F.cat || a.category === F.cat) && (!q || (a.title + " " + a.description).toLowerCase().includes(q)));
  L.forEach(a => a.dist = pos && a.lat != null ? km(pos, a) : null);
  L.sort(F.sort === "near" ? (x, y) => (x.dist ?? 1e9) - (y.dist ?? 1e9)
    : F.sort === "lo" ? (x, y) => x.price - y.price
    : F.sort === "hi" ? (x, y) => y.price - x.price
    : (x, y) => (y.createdAt?.seconds || 0) - (x.createdAt?.seconds || 0));
  box.innerHTML = L.length ? L.map(card).join("") : `<p class="mut">Koi ad nahi mili</p>`;
}
async function toggleFav(id, el) {
  const r = doc(db, "users", me.uid, "favs", id);
  if (favs.has(id)) { favs.delete(id); await deleteDoc(r); } else { favs.add(id); await setDoc(r, { at: serverTimestamp() }); }
  const on = favs.has(id);
  el.textContent = el.classList.contains("btn") ? (on ? "❤️ Saved" : "🤍 Save") : (on ? "❤️" : "🤍");
}

/* ---------- ad detail ---------- */
async function viewDetail(id) {
  let s; try { s = await getDoc(doc(db, "ads", id)); } catch (e) { return toast("Ad nahi mili"); }
  if (!s.exists()) return toast("Ad nahi mili");
  const a = { id, ...s.data() }, own = a.userId === me.uid;
  A.innerHTML = `<div class="pad"><button class="lnk" id="bk">← Wapas</button>
  <div class="car">${(a.images || []).map(i => `<img src="${i}" alt="">`).join("")}</div>
  <h2>₹${a.price}</h2><h3>${esc(a.title)}</h3>
  <p class="mut">📍 ${esc(a.city)} • ${esc(a.condition)} • ${esc(a.category)}</p>
  <p>${esc(a.description)}</p><p class="mut">Seller: ${esc(a.sellerName)}</p>
  ${a.status === "sold" ? "<b>SOLD ✔</b>" : own ? "" : `<button class="btn" id="cb">💬 Seller se chat karo</button>`}
  <button class="btn alt" data-fav="${id}">${favs.has(id) ? "❤️ Saved" : "🤍 Save"}</button></div>`;
  $("#bk").onclick = () => go("home");
  if ($("#cb")) $("#cb").onclick = () => startChat(a);
}

/* ---------- sell ---------- */
function viewSell() {
  imgs = [];
  A.innerHTML = `<div class="pad"><h2>Ad post karo</h2>
  <input type="file" id="im" accept="image/*" multiple><p class="mut">Max 4 photos</p><div id="pv" class="pv"></div>
  <input id="t" placeholder="Title (jaise: iPhone 11, 64GB)">
  <textarea id="d" placeholder="Description"></textarea>
  <select id="c">${cats.map(c => `<option>${esc(c)}</option>`).join("")}</select>
  <select id="cd"><option>Used</option><option>Like New</option><option>New</option></select>
  <input id="pr" type="number" placeholder="Price (₹)">
  <input id="ci" placeholder="City / Area" value="${esc(myDoc.city || "")}">
  <button class="btn alt" id="lo">📍 Meri location use karo</button>
  <button class="btn" id="go">Ad post karo</button></div>`;
  $("#im").onchange = async e => {
    imgs = [];
    for (const f of [...e.target.files].slice(0, 4)) imgs.push(await compress(f));
    $("#pv").innerHTML = imgs.map(i => `<img src="${i}" alt="">`).join("");
  };
  $("#lo").onclick = async () => { if (await getLoc()) toast("Location mil gayi ✅"); };
  $("#go").onclick = async () => {
    const t = $("#t").value.trim(), p = Number($("#pr").value), ci = $("#ci").value.trim();
    if (!imgs.length || !t || !p || !ci) return toast("Photo, title, price aur city zaroori hai");
    $("#go").disabled = true;
    try {
      await addDoc(collection(db, "ads"), {
        userId: me.uid, sellerName: myDoc.name, title: t, description: $("#d").value.trim(),
        category: $("#c").value, condition: $("#cd").value, price: p, city: ci,
        lat: pos?.lat ?? null, lng: pos?.lng ?? null, images: imgs, status: "pending", createdAt: serverTimestamp()
      });
      toast("Ad bhej di! Admin approve karega"); go("profile");
    } catch (e) { toast(e.message); $("#go").disabled = false; }
  };
}

/* ---------- chat ---------- */
async function startChat(a) {
  const id = a.id + "_" + me.uid;
  const data = { participants: [me.uid, a.userId], adId: a.id, adTitle: a.title, buyerId: me.uid, sellerId: a.userId, buyerName: myDoc.name, sellerName: a.sellerName };
  try { await setDoc(doc(db, "chats", id), data, { merge: true }); go("chat", { id, ...data }); }
  catch (e) { toast(e.message); }
}
function viewChats() {
  A.innerHTML = `<div class="pad"><h2>Chats</h2><div id="cl"><p class="mut">Loading...</p></div></div>`;
  unsub = onSnapshot(query(collection(db, "chats"), where("participants", "array-contains", me.uid)), s => {
    const L = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.lastMessage)
      .sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));
    chatMeta = {}; L.forEach(c => chatMeta[c.id] = c);
    $("#cl").innerHTML = L.length ? L.map(c => `<div class="row2" data-chat="${c.id}"><b>${esc(c.buyerId === me.uid ? c.sellerName : c.buyerName)}</b>
      <div class="mut">${esc(c.adTitle)}</div><div>${esc(c.lastMessage)}</div></div>`).join("")
      : `<p class="mut">Abhi koi chat nahi. Kisi ad par "Seller se chat karo" dabao.</p>`;
  });
}
function viewChat(c) {
  const other = c.buyerId === me.uid ? c.sellerName : c.buyerName;
  A.innerHTML = `<div class="chat"><div class="ch-h"><button class="lnk" id="bk">←</button>
  <div><b>${esc(other)}</b><div class="mut">${esc(c.adTitle)}</div></div></div>
  <div id="ms" class="ms"></div>
  <div class="ch-f"><input id="mi" placeholder="Message likho..."><button class="btn" id="sd">Send</button></div></div>`;
  $("#bk").onclick = () => go("chats");
  unsub = onSnapshot(query(collection(db, "chats", c.id, "messages"), orderBy("createdAt")), s => {
    $("#ms").innerHTML = s.docs.map(d => { const m = d.data(); return `<div class="m ${m.from === me.uid ? "me" : ""}">${esc(m.text)}</div>`; }).join("");
    $("#ms").scrollTop = 1e9;
  }, () => {});
  const send = async () => {
    const t = $("#mi").value.trim(); if (!t) return; $("#mi").value = "";
    try {
      await setDoc(doc(db, "chats", c.id), { lastMessage: t, updatedAt: serverTimestamp() }, { merge: true });
      await addDoc(collection(db, "chats", c.id, "messages"), { from: me.uid, text: t, createdAt: serverTimestamp() });
    } catch (e) { toast(e.message); }
  };
  $("#sd").onclick = send;
  $("#mi").onkeydown = e => { if (e.key === "Enter") send(); };
}

/* ---------- profile ---------- */
function viewProfile() {
  A.innerHTML = `<div class="pad"><h2>👤 ${esc(myDoc.name)}</h2><p class="mut">${esc(myDoc.email)}</p>
  <div class="tabs"><button data-t="ads">Meri Ads</button><button data-t="fav">Favorites</button><button data-t="edit">Edit</button></div>
  <div id="pb"></div><button class="btn alt" id="lg">Logout</button></div>`;
  const tabs = A.querySelectorAll(".tabs button");
  tabs.forEach(b => b.onclick = () => { tabs.forEach(x => x.classList.toggle("on", x === b)); pTab(b.dataset.t); });
  tabs[0].click();
  $("#lg").onclick = () => signOut(auth);
}
async function pTab(t) {
  const box = $("#pb"); box.onclick = null; box.innerHTML = "Loading...";
  if (t === "ads") {
    const s = await getDocs(query(collection(db, "ads"), where("userId", "==", me.uid)));
    box.innerHTML = s.empty ? `<p class="mut">Aapne abhi koi ad post nahi ki</p>` : s.docs.map(d => {
      const a = d.data();
      return `<div class="row2"><b>${esc(a.title)}</b> • ₹${a.price}<br><span class="badge">${a.status}</span>
      ${a.rejectReason ? `<p class="mut">Reason: ${esc(a.rejectReason)}</p>` : ""}<br>
      ${a.status === "approved" ? `<button class="lnk" data-sold="${d.id}">Sold mark karo</button> ` : ""}
      <button class="lnk" data-del="${d.id}">Delete</button></div>`;
    }).join("");
    box.onclick = async e => {
      const sold = e.target.dataset.sold, del = e.target.dataset.del;
      if (sold) { await updateDoc(doc(db, "ads", sold), { status: "sold" }); pTab("ads"); }
      if (del && confirm("Ad delete karein?")) { await deleteDoc(doc(db, "ads", del)); pTab("ads"); }
    };
  } else if (t === "fav") {
    const L = (await Promise.all([...favs].map(i => getDoc(doc(db, "ads", i)).catch(() => null))))
      .filter(x => x && x.exists()).map(x => ({ id: x.id, ...x.data() }));
    box.innerHTML = L.length ? `<div class="grid" style="padding:0">${L.map(card).join("")}</div>` : `<p class="mut">Koi favorite nahi</p>`;
  } else {
    box.innerHTML = `<input id="en" placeholder="Naam" value="${esc(myDoc.name)}"><input id="ep" placeholder="Phone" value="${esc(myDoc.phone)}">
    <input id="ec" placeholder="City" value="${esc(myDoc.city)}"><button class="btn" id="sv">Save changes</button>`;
    $("#sv").onclick = async () => {
      const d = { name: $("#en").value.trim() || myDoc.name, phone: $("#ep").value.trim(), city: $("#ec").value.trim() };
      await updateDoc(doc(db, "users", me.uid), d); Object.assign(myDoc, d); toast("Profile save ho gayi");
    };
  }
}
</script>
</body>
</html>
